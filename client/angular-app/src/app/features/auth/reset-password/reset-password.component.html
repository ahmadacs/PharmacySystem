<div class="auth-page">
  @if (submitting()) { <mat-progress-bar class="auth-page__progress" mode="indeterminate" /> }
  <mat-card class="auth-page__card">
    <mat-card-header class="auth-page__header"><mat-icon class="auth-page__logo" fontIcon="password" /><mat-card-title>Reset password</mat-card-title><mat-card-subtitle>Choose a new password for your account</mat-card-subtitle></mat-card-header>
    <mat-card-content><form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline" class="auth-page__field"><mat-label>Email</mat-label><input matInput formControlName="email" type="email" autocomplete="email" /><mat-error>Enter a valid email address.</mat-error></mat-form-field>
      <mat-form-field appearance="outline" class="auth-page__field"><mat-label>Reset token</mat-label><input matInput formControlName="token" /><mat-error>Reset token is required.</mat-error></mat-form-field>
      <mat-form-field appearance="outline" class="auth-page__field"><mat-label>New password</mat-label><input matInput formControlName="newPassword" type="password" autocomplete="new-password" /><mat-error>Password must be at least 8 characters.</mat-error></mat-form-field>
      <mat-form-field appearance="outline" class="auth-page__field"><mat-label>Confirm new password</mat-label><input matInput formControlName="confirmNewPassword" type="password" autocomplete="new-password" /><mat-error>Confirmation is required.</mat-error></mat-form-field>
      <button mat-flat-button color="primary" class="auth-page__submit" type="submit" [disabled]="submitting()">Reset password</button>
    </form></mat-card-content>
    <mat-card-footer class="auth-page__footer"><a routerLink="/login">Back to sign in</a></mat-card-footer>
  </mat-card>
</div>
