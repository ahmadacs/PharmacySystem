<div class="auth-page">
  @if (submitting()) { <mat-progress-bar class="auth-page__progress" mode="indeterminate" /> }
  <mat-card class="auth-page__card">
    <mat-card-header class="auth-page__header"><mat-icon class="auth-page__logo" fontIcon="lock_reset" /><mat-card-title>{{ 'auth.forgotTitle' | translate }}</mat-card-title><mat-card-subtitle>{{ 'auth.forgotSubtitle' | translate }}</mat-card-subtitle></mat-card-header>
    <mat-card-content><form [formGroup]="form" (ngSubmit)="submit()" novalidate><mat-form-field appearance="outline" class="auth-page__field"><mat-label>{{ 'auth.email' | translate }}</mat-label><input matInput formControlName="email" type="email" autocomplete="email" /><mat-error>{{ 'auth.emailInvalid' | translate }}</mat-error></mat-form-field><button mat-flat-button color="primary" class="auth-page__submit" type="submit" [disabled]="submitting()">{{ 'auth.sendResetLink' | translate }}</button></form></mat-card-content>
    <mat-card-footer class="auth-page__footer"><a routerLink="/login">{{ 'auth.backToSignIn' | translate }}</a></mat-card-footer>
  </mat-card>
</div>
