<div class="auth-page">
  @if (submitting()) { <mat-progress-bar class="auth-page__progress" mode="indeterminate" /> }
  <mat-card class="auth-page__card">
    <mat-card-header class="auth-page__header"><mat-icon class="auth-page__logo" fontIcon="lock_reset" /><mat-card-title>Forgot password?</mat-card-title><mat-card-subtitle>Enter your email to request a reset link</mat-card-subtitle></mat-card-header>
    <mat-card-content><form [formGroup]="form" (ngSubmit)="submit()" novalidate><mat-form-field appearance="outline" class="auth-page__field"><mat-label>Email</mat-label><input matInput formControlName="email" type="email" autocomplete="email" /><mat-error>Enter a valid email address.</mat-error></mat-form-field><button mat-flat-button color="primary" class="auth-page__submit" type="submit" [disabled]="submitting()">Send reset link</button></form></mat-card-content>
    <mat-card-footer class="auth-page__footer"><a routerLink="/login">Back to sign in</a></mat-card-footer>
  </mat-card>
</div>
