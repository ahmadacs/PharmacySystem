<mat-sidenav-container class="shell" autosize>
  <mat-sidenav
    class="shell__sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
  >
    <div class="shell__brand">
      <mat-icon>medical_services</mat-icon>
      <span>{{ 'common.appName' | translate }}</span>
    </div>
    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link" (click)="onNavigate()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <!-- Header تماماً كما في html.html -->
    <div class="topbar">
      <button class="icon-btn" (click)="toggleSidenav()" [attr.aria-label]="'common.toggleNavigation' | translate">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="topbar__spacer"></span>
      <div class="top-actions">
        <button
          class="icon-btn theme-toggle"
          (click)="themeService.toggle()"
          [attr.aria-label]="(themeService.dark() ? 'shell.lightMode' : 'shell.darkMode') | translate"
          [attr.title]="(themeService.dark() ? 'shell.lightMode' : 'shell.darkMode') | translate"
        >
          @if (themeService.dark()) {
            <mat-icon>light_mode</mat-icon>
          } @else {
            <mat-icon>dark_mode</mat-icon>
          }
        </button>
        <button
          class="icon-btn lang-btn"
          (click)="localizationService.toggle()"
          [attr.aria-label]="'common.language' | translate"
          [attr.title]="'common.language' | translate"
        >
          <mat-icon>language</mat-icon>
        </button>
        <app-notification-bell />
        <button class="user-btn" [matMenuTriggerFor]="userMenu" [attr.aria-label]="'common.userMenu' | translate">
          <div class="avatar">{{ firstName()[0] || 'U' }}</div>
          <div class="who">
            <div class="name">{{ firstName() }}</div>
            <div class="role">{{ authStore.role() }}</div>
          </div>
          <mat-icon class="chev">expand_more</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before" panelClass="user-menu-panel">
          <button mat-menu-item (click)="openChangePassword()">
            <mat-icon>lock</mat-icon>
            <span>{{ 'shell.changePassword' | translate }}</span>
          </button>
          <button mat-menu-item (click)="logout()" class="logout-item">
            <mat-icon>logout</mat-icon>
            <span>{{ 'shell.logout' | translate }}</span>
          </button>
        </mat-menu>
      </div>
    </div>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
