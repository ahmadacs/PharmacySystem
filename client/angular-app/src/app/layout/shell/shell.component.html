<mat-sidenav-container class="shell" autosize>
  <mat-sidenav
    class="shell__sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
  >
    <div class="shell__brand">
      <mat-icon>local_pharmacy</mat-icon>
      <span>Pharmacy System</span>
    </div>
    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link" (click)="onNavigate()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell__toolbar">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="shell__spacer"></span>
      <app-notification-bell />
      <button mat-icon-button (click)="localizationService.toggle()" [attr.aria-label]="localizationService.currentLang()">
        <mat-icon>language</mat-icon>
      </button>
      <button mat-icon-button (click)="themeService.toggle()" [attr.aria-label]="themeService.dark() ? 'Switch to light theme' : 'Switch to dark theme'">
        <mat-icon>{{ themeService.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item disabled>
          <span>{{ displayName() }}</span>
          <span class="shell__role">{{ authStore.role() }}</span>
        </button>
        <button mat-menu-item (click)="openChangePassword()">
          <mat-icon>lock</mat-icon>
          <span>Change password</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
