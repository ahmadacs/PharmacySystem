<mat-sidenav-container class="shell" autosize>
  <mat-sidenav
    class="shell__sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
  >
    <div class="shell__brand">
      <mat-icon>local_pharmacy</mat-icon>
      <span>Pharmacy System</span>
    </div>
    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link" (click)="onNavigate()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <!-- Header تماماً كما في html.html -->
    <div class="topbar">
      <button class="icon-btn" (click)="toggleSidenav()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="topbar__spacer"></span>
      <div class="top-actions">
        <div class="lang-switch">
          <button [class.active]="localizationService.currentLang() === 'ar'" (click)="localizationService.currentLang.set('ar')">AR</button>
          <button [class.active]="localizationService.currentLang() === 'en'" (click)="localizationService.currentLang.set('en')">EN</button>
        </div>
        <app-notification-bell />
        <button class="user-btn" [matMenuTriggerFor]="userMenu" aria-label="User menu">
          <div class="avatar">{{ firstName()[0] || 'U' }}</div>
          <div class="who">
            <div class="name">{{ firstName() }}</div>
            <div class="role">{{ authStore.role() }}</div>
          </div>
          <mat-icon class="chev">expand_more</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <button mat-menu-item (click)="openChangePassword()">
            <mat-icon>lock</mat-icon>
            <span>{{ 'shell.changePassword' | translate }}</span>
          </button>
          <button mat-menu-item (click)="logout()" class="logout-item">
            <mat-icon>logout</mat-icon>
            <span>{{ 'shell.logout' | translate }}</span>
          </button>
        </mat-menu>
      </div>
    </div>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
