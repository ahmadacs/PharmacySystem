services:
  redis:
    image: redis:7.4-alpine
    container_name: pharmacy-redis
    # Hardened single-instance cache (ephemeral OutputCache only — data loss = cache miss).
    # - maxmemory 256MB + allkeys-lru: cache must evict, never OOM (noeviction is for primary DBs).
    # - Persistence explicitly disabled (save "" + appendonly no): faster restarts, no stale RDB.
    # - requirepass + protected-mode yes + loopback-only published port (dev): no open Redis.
    # - Dangerous commands disabled via rename-command; lazyfree avoids latency spikes.
    # NOTE: single-$ ${REDIS_PASSWORD} below is intentional: compose interpolates
    # it at startup (command is exec-form, no shell). The healthcheck uses
    # double-$$ because CMD-SHELL expands it inside the container instead.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD}"
      --protected-mode yes
      --save ""
      --appendonly no
      --databases 2
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
      --slowlog-log-slower-than 5000
      --slowlog-max-len 256
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pharmacy-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pharmacy-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - pharmacy-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -b -C"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    build:
      context: .
      dockerfile: ./src/WebApi/Dockerfile
    container_name: pharmacy-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=PharmacySystem;User=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      - Storage__BasePath=/app/uploads
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Jwt__Issuer=http://localhost:5066
      - Jwt__Audience=http://localhost:5066
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5066:8080"
    networks:
      - pharmacy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  angular:
    build:
      context: .
      dockerfile: ./client/angular-app/Dockerfile
    container_name: pharmacy-angular
    environment:
      - API_URL=http://api:8080/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - pharmacy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mssql-data:
  redis-data:
  uploads-data:

networks:
  pharmacy-network:
    driver: bridge